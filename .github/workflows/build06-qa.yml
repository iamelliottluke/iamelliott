name: IAMELLIOTT Build 06 visual verification
on:
  push:
    branches: [iamelliott-build06-polish, iamelliott-build07-overlay-key]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check site.js
          node --check media.js
          node --check build03.js
      - run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - run: python tests/build06_visual.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build06-review-screenshots
          path: qa-output/**
