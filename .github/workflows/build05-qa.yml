name: IAMELLIOTT Build 05 responsive QA
on:
  push:
    branches: [iamelliott-build05-navigation-layout]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check media.js
          node --check site.js
          node --check build03.js
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check layouts and menus at six sizes
        run: python tests/build05_smoke.py
      - name: Upload browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamelliott-build05-preview
          path: qa-output/**
