name: IAMELLIOTT Build 04 visual and functional QA
on:
  push:
    branches: [iamelliott-build04-final-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check media.js
          node --check site.js
          node --check build03.js
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Regression plus optical checks
        run: |
          python tests/build03_smoke.py
          python tests/build04_visual.py
      - name: Archive previews and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IAMELLIOTT-Build04-QA
          path: qa-output/**
          if-no-files-found: error
