name: IAMELLIOTT Build 03 browser regression
on:
  push:
    branches: [iamelliott-build03-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check media.js
          node --check site.js
          node --check build03.js
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run local browser regression
        run: python tests/build03_smoke.py
      - name: Upload review screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iamelliott-build03-qa
          path: |
            qa-output/**
          if-no-files-found: ignore
