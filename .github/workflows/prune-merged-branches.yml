name: One-time IAMELLIOTT merged-branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Prune only verified merged review branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            iamelliott-build04-final-review \
            iamelliott-build05-navigation-layout \
            iamelliott-build06-polish \
            iamelliott-build07-overlay-key
          do
            echo "Checking $branch"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "Deleted $branch"
            else
              echo "Already absent: $branch"
            fi
          done
