name: Optimize butterfly display images (review branch only)
on:
  push:
    branches: [iamelliott-build03-review]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Resize and compress monarch photographs without changing filenames
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageOps
          for p in sorted(Path('.').glob('butterfly[1-4].jpg')):
              if p.stat().st_size <= 900_000:
                  print('Already optimized:', p)
                  continue
              with Image.open(p) as src:
                  img = ImageOps.exif_transpose(src).convert('RGB')
                  old_dims = img.size
                  img.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
                  img.save(p, 'JPEG', quality=84, optimize=True, progressive=True, subsampling=0)
                  print(f'{p}: {old_dims} -> {img.size}; {p.stat().st_size:,} bytes')
      - name: Commit optimized originals on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add butterfly1.jpg butterfly2.jpg butterfly3.jpg butterfly4.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Optimize butterfly image assets for faster page loads"
            git push
          fi
