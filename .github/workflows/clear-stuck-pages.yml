name: One-time Pages deployment unlock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-stuck-pages.yml'
permissions:
  contents: read
  pages: write
jobs:
  unlock:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel only the stale cancelled Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/f2b0c0b86f24b51b45b3624e763e3a139d4e6fd6/cancel"
          echo "Cancelled stale Pages deployment from f2b0c0b"
