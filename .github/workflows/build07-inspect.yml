name: IAMELLIOTT Build07 overlay inspection
on:
  push:
    branches: [iamelliott-build07-overlay-key]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Inspect original greenscreen source
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import Counter
          im=Image.open('overlay5.webp').convert('RGB')
          print("SIZE",im.size)
          w,h=im.size
          spots=[(0,0),(.03,.03),(.97,.03),(.03,.97),(.97,.97),(.5,.5),(.5,.03),(.03,.5),(.97,.5)]
          for x,y in spots:
            print("SAMPLE",x,y,im.getpixel((min(w-1,int(x*w)),min(h-1,int(y*h)))))
          small=im.resize((100,100))
          print("COMMON",Counter(small.getdata()).most_common(14))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: overlay5-original-source
          path: overlay5.webp
