name: IAMELLIOTT render transparent How I Work texture
on:
  push:
    branches: [iamelliott-build07-overlay-key]
    paths:
      - '.github/workflows/build07-inspect.yml'
      - 'overlay5.webp'
permissions:
  contents: write
jobs:
  key:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Remove original matte, preserving bright overlay texture
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Image.open('overlay5.webp').convert('RGBA')
          pixels=source.load()
          for y in range(source.height):
            for x in range(source.width):
              r,g,b,_=pixels[x,y]
              brightness=max(r,g,b)
              strength=max(0.,min(1.,(brightness-76)/125))**1.3
              pixels[x,y]=(r,g,b,round(strength*255))
          source.save('overlay5-keyed.webp',format='WEBP',lossless=True,method=6)
          print('Preserved original overlay5.webp; derivative output:',Path('overlay5-keyed.webp').stat().st_size)
          PY
      - name: Commit keyed derivative
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlay5-keyed.webp
          if ! git diff --cached --quiet; then
            git commit -m "Preserve original overlay and add matte-free transparent derivative"
            git push
          fi
