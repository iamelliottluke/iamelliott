name: Prepare transparent monarch display assets (review only)
on:
  push:
    branches: [iamelliott-build04-final-review]
    paths: ['.github/workflows/monarch-cutout.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cutouts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PIL
        run: python -m pip install pillow==11.3.0
      - name: Remove white backgrounds without altering source photographs
        shell: python
        run: |
          from PIL import Image
          from pathlib import Path
          for name in ('butterfly3','butterfly4'):
              source=Path(name+'.jpg')
              dest=Path(name+'-cutout.png')
              with Image.open(source) as im:
                  src=im.convert('RGB')
                  w,h=src.size
                  out=Image.new('RGBA',src.size)
                  pixels=[]
                  for i,(r,g,b) in enumerate(src.getdata()):
                      y=i//w
                      minimum=min(r,g,b)
                      if y<5:
                          a=0
                      elif minimum>=244:
                          a=0
                      elif minimum>210:
                          a=round(255*(244-minimum)/34)
                      else:
                          a=255
                      pixels.append((r,g,b,a))
                  out.putdata(pixels)
                  out.save(dest,format='PNG',optimize=True)
                  print(dest,w,h,'size:',dest.stat().st_size)
      - name: Commit only transparent derivatives to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add butterfly3-cutout.png butterfly4-cutout.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate transparent monarch display assets"
            git push
          fi
