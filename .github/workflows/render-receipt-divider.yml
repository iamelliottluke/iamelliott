name: Render receipt divider for final review
on:
  workflow_dispatch:
  push:
    branches: [iamelliott-favicon-light-dark]
    paths:
      - 'receipt.pdf'
      - '.github/workflows/render-receipt-divider.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.5 Pillow==11.3.0
      - name: Render existing receipt artwork as a horizontal divider
        shell: python
        run: |
          import fitz
          from PIL import Image
          from pathlib import Path
          pdf=fitz.open('receipt.pdf')
          parts=[]
          for i,page in enumerate(pdf):
              crop=page.rect
              if i==len(pdf)-1:
                  crop=fitz.Rect(crop.x0,crop.y0,crop.x1,crop.y0+crop.height*.88)
              pix=page.get_pixmap(matrix=fitz.Matrix(2,2),clip=crop,alpha=False)
              im=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
              parts.append(im)
          # Join sequential pages vertically to preserve reading order, then rotate entire strip.
          w=max(p.width for p in parts)
          h=sum(p.height for p in parts)
          vertical=Image.new('RGB',(w,h),'white')
          y=0
          for p in parts:
              vertical.paste(p,((w-p.width)//2,y))
              y+=p.height
          horizontal=vertical.transpose(Image.Transpose.ROTATE_90)
          if horizontal.width>3200:
              horizontal.thumbnail((3200,1000),Image.Resampling.LANCZOS)
          horizontal.save('receipt-divider.png',optimize=True)
          print(f'PDF pages={len(pdf)}; output={horizontal.size}; bytes={Path("receipt-divider.png").stat().st_size}')
      - name: Commit generated divider to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipt-divider.png
          if ! git diff --cached --quiet; then
            git commit -m "Render source receipt as full-width horizontal divider"
            git push
          fi
